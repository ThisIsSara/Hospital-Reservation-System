<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Patient Account | Hospital Reservation System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-page="register">
<header class="site-header"><div class="header-inner">
    <a class="brand" href="login.html">Hospital Reservation System</a>
    <nav aria-label="Main navigation"><a href="login.html">Log in</a><a href="register.html">Create Account</a></nav>
</div></header>
<main>
<noscript><p class="alert error">Enable JavaScript to submit forms and load appointment data.</p></noscript>
<section class="form-card">
    <p class="eyebrow">Patient registration</p><h1>Create your account</h1>
    <p>Register to view doctors and book an appointment.</p>
    <div id="message" role="status" hidden></div>
    <form id="registration-form" action="../backend/register.php" method="post">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" autocomplete="name" maxlength="120" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="190" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <small>Use 8–72 English letters, numbers or symbols.</small>
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <button type="submit" disabled>Register</button>
    </form>
    <p class="form-link">Already registered? <a href="login.html">Log in</a></p>
</section>
</main>
</body>
</html>
